#         api_base: ${AZURE_API_BASE}
#         api_version: "2024-02-01"
#         temperature: 0.7
#         max_tokens: 2000

# Environment Variables Required:
# - OPENAI_API_KEY (for OpenAI models)
# - GEMINI_API_KEY (for Google models)
# - ANTHROPIC_API_KEY (for Anthropic models)
# - AZURE_API_KEY, AZURE_API_BASE (for Azure OpenAI)

# Optional Environment Variables:
# - LITELLM_ROUTING_STRATEGY (override routing_strategy)
# - AGENT_TEMPERATURE (override temperature)
# - AGENT_MAX_TOKENS (override max_tokens)
# - AGENT_LOG_LEVEL (override log_level)
